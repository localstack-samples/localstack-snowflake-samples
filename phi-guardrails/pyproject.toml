[project]
name = "phi-guardrails"
version = "0.1.0"
description = "Governance as code for a healthcare dataset: a role-by-column access matrix generated from a contract file, plus a policy-coverage gate."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "schemachange==4.4.0",
    "snowflake-connector-python>=4.0,<5.0",
    "cryptography>=44",
    "jinja2>=3.1",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phi_guardrails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Raised inside the connector's vendored urllib3, not by this sample.
    "ignore:X509.get_subject is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
