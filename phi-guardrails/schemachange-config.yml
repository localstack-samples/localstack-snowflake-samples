# schemachange 4.4 configuration. Connection settings are not stored here:
# phi_guardrails.deploy passes them as SNOWFLAKE_* variables in a scrubbed
# environment, plus --change-history-table and --vars for the target database.
config-version: 2

schemachange:
  root-folder: migrations
  create-change-history-table: true
  query-tag: phi-guardrails
