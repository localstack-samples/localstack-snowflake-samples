[project]
name = "migrate-and-swap"
version = "0.1.0"
description = "Zero-downtime schema releases with schemachange: migrate a clone, validate it, swap it in, roll back with one more swap."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "schemachange==4.4.0",
    # schemachange 4.4.0 requires snowflake-connector-python<5.0.
    "snowflake-connector-python>=4.0,<5.0",
    "cryptography>=44",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["release"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Raised inside the connector's vendored urllib3, not by this sample.
    "ignore:X509.get_subject is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
