# Snowflake-Next emulator for the Migrate and Swap sample.
# Host port is ${SNOWFLAKE_PORT:-4566}, bound to 127.0.0.1 only, so it is reachable from this machine alone.
services:
  snowflake:
    image: ${SNOWFLAKE_IMAGE:-localstack/snowflake-next:latest}
    pull_policy: always
    ports:
      - "127.0.0.1:${SNOWFLAKE_PORT:-4566}:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN}
    volumes:
      - ./init:/etc/localstack/init/ready.d:ro
    networks:
      default:
        aliases:
          - snowflake.localhost.localstack.cloud
          - stages.s3.localhost.localstack.cloud
          - stages-enc.s3.localhost.localstack.cloud
