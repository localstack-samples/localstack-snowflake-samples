   checks for test_table:
   # Checks that dataset contains fewer than 2 rows; written to fail
     - row_count < 2:
         name: Dataset is unreasonably small
   # Checks that column contains no NULL values
     - missing_count(name) = 0:
         name: No NULL values
   # Checks that the expected columns exist. Checks for schema changes over
   # time ("when schema changes") need a Soda Cloud account to store history.
     - schema:
         fail:
           when required column missing: [id, name]
         name: Required columns present
