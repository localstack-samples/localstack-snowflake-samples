name: Test samples

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # nightly regression run against the newest snowflake-next image
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sample:
          - airflow-dbt-transformation
          - citi-bike-data-app
          - claims-service
          - credit-card-fraud-detection-with-snowpark
          - credit-scoring-with-snowpark
          - fleet-telemetry
          - glue-snowflake-integration
          - lambda-snowpark-connector
          - metering-api
          - migrate-and-swap
          - multi-container
          - order-to-cash-cdc
          - phi-guardrails
          - predicting-customer-spend
          - slim-ci-lab
          - soda-data-quality-checks
          - streamlit-snowpark-dynamic-filters
          - tenantboard
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Terraform
        if: matrix.sample == 'glue-snowflake-integration'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup uv
        if: hashFiles(format('{0}/uv.lock', matrix.sample)) != ''
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Java
        if: hashFiles(format('{0}/pom.xml', matrix.sample)) != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Go
        if: hashFiles(format('{0}/go.mod', matrix.sample)) != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.sample }}/go.mod
          cache-dependency-path: ${{ matrix.sample }}/go.sum

      - name: Setup .NET
        if: hashFiles(format('{0}/global.json', matrix.sample)) != ''
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ matrix.sample }}/global.json

      - name: Install lstk and the Snowflake and AWS CLIs
        run: |
          npm install -g @localstack/lstk
          pip install snowflake-cli awscli-local terraform-local
          for name in localstack local; do
            snow connection add --connection-name $name --user test --password test \
              --account test --host snowflake.localhost.localstack.cloud --no-interactive
          done

      - name: Install sample dependencies
        run: make install

      - name: Start LocalStack for Snowflake
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        # samples whose `start` target runs the app name this target start-localstack
        run: |
          if grep -q '^start-localstack:' Makefile; then make start-localstack; else make start; fi

      - name: Run tests
        env:
          # samples tested with Testcontainers start their own emulator
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: make test

      - name: Show LocalStack logs
        if: failure()
        env:
          # docker compose refuses to read a compose file that requires the token
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: make logs || true
