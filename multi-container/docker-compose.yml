services:
  localstack-snowflake:
    container_name: "localstack-snowflake"
    image: localstack/snowflake:latest
    networks:
      - localstack
    ports:
      - "4567:4567"
    environment:
      - DEBUG=true # set to "true" to enable debug logging
      - GATEWAY_LISTEN=0.0.0.0:4567
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?}
      # hostnames routed to the Snowflake emulator: the container name for
      # requests from the AWS container, and the default name for host clients
      - SF_HOSTNAMES=localstack-snowflake,snowflake.localhost.localstack.cloud
      # S3 endpoints of the AWS container, for stages that load data from S3
      - SF_S3_ENDPOINT=http://localstack-aws:4566
      - SF_S3_ENDPOINT_EXTERNAL=http://localhost:4566
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4567/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - "./volume/snowflake:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  localstack-aws:
    container_name: "localstack-aws"
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - DEBUG=${DEBUG:-0}
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - "./volume/aws:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - localstack

networks:
  localstack:
    external: false
    driver: bridge
    name: localstack
