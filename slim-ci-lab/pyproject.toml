[project]
name = "slim-ci-lab"
version = "0.1.0"
description = "dbt Slim CI against the Snowflake-Next emulator: per-PR schemas, state:modified+ with defer, zero credits."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # dbt-snowflake 1.10.x pins snowflake-connector-python <5, so the
    # connector comes from here (4.x) rather than being pinned directly.
    "dbt-core>=1.10,<1.11",
    "dbt-snowflake>=1.10,<1.11",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
slim-ci-load = "slim_ci_lab.loader:main"
slim-ci-demo-bad-pr = "slim_ci_lab.bad_pr_demo:main"
slim-ci-summary = "slim_ci_lab.ci_summary:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Raised inside the connector's vendored urllib3, not by this project.
    "ignore:X509.get_subject is deprecated:DeprecationWarning",
]
