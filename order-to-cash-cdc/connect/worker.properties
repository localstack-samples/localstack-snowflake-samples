# Kafka Connect distributed worker (single node).
bootstrap.servers=kafka:29092
group.id=o2c-connect
listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect
plugin.path=/opt/connect/plugins

# Internal topics. Replication factor 1 because the sample runs one broker.
config.storage.topic=_connect-configs
offset.storage.topic=_connect-offsets
status.storage.topic=_connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.flush.interval.ms=1000

# Worker-level converters; the Snowflake sink overrides them per connector.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Secrets stay out of the connector config (and out of GET /connectors):
# the sink references ${file:/opt/connect/secrets/connector.properties:...}.
config.providers=file
config.providers.file.class=org.apache.kafka.common.config.provider.FileConfigProvider
