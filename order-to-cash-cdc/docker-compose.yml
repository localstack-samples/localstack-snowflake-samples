name: snfs-order-to-cash-cdc

services:
  snowflake:
    image: ${SNOWFLAKE_IMAGE:-localstack/snowflake-next:latest}
    pull_policy: always
    ports:
      - "127.0.0.1:${SNOWFLAKE_PORT:-4566}:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?set LOCALSTACK_AUTH_TOKEN}
    volumes:
      - ./init:/etc/localstack/init/ready.d:ro
    networks:
      default:
        aliases:
          # Kafka Connect reaches the emulator by its public hostname on 4566,
          # so the connector sees the same TLS certificate a host client does.
          - snowflake.localhost.localstack.cloud
          - stages.s3.localhost.localstack.cloud
          - stages-enc.s3.localhost.localstack.cloud

  kafka:
    # Single-node KRaft broker (combined broker + controller, no ZooKeeper).
    image: apache/kafka:3.7.1
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092,CONTROLLER://:9093
      # INTERNAL is for Kafka Connect on the compose network, EXTERNAL for the
      # producer and tests on the host.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 5s
      timeout: 20s
      retries: 24

  connect:
    build:
      context: ./connect
    image: snfs-order-to-cash-cdc-connect:2.1.2
    depends_on:
      kafka:
        condition: service_healthy
      snowflake:
        condition: service_started
    ports:
      - "127.0.0.1:${CONNECT_PORT:-18083}:8083"
    volumes:
      # connector.properties holds the private key for the sink's
      # FileConfigProvider reference (generated by `make up`, gitignored).
      - ./.secrets:/opt/connect/secrets:ro
